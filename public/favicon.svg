<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#0A2540" />
  <g transform="translate(4, 14)">
    <!-- Base Ground Line -->
    <path d="M 6 88 H 114" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- SKYLINE BUILDINGS -->
    <path d="M 12 88 V 54 L 26 42 V 88" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 88 V 26 L 40 16 L 50 26 V 88" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40 16 V 6" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="5" r="3" fill="#FF5A36"/>
    <path d="M 54 88 V 36 L 70 48 V 88" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- COMMUNITY CIVIC NETWORK -->
    <path d="M 70 48 L 84 30 L 100 22 L 114 40" stroke="#FF5A36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 84 30 L 94 56 L 110 64 L 114 40" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 70 88 V 64 L 94 56 M 100 22 L 110 64" stroke="#FF5A36" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 84 30 L 110 64 M 94 56 L 114 40" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="4 3"/>

    <!-- Network Nodes -->
    <circle cx="84" cy="30" r="5" fill="#FF5A36" stroke="#0A2540" stroke-width="2"/>
    <circle cx="100" cy="22" r="6" fill="#FF5A36" stroke="#0A2540" stroke-width="2"/>
    <circle cx="114" cy="40" r="5" fill="#FF5A36" stroke="#0A2540" stroke-width="2"/>
    <circle cx="94" cy="56" r="5.5" fill="#2DD4BF" stroke="#0A2540" stroke-width="2"/>
    <circle cx="110" cy="64" r="5" fill="#2DD4BF" stroke="#0A2540" stroke-width="2"/>
    <circle cx="70" cy="48" r="4.5" fill="#38BDF8" stroke="#0A2540" stroke-width="2"/>
  </g>
